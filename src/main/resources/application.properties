spring.application.name=airfrance
spring.datasource.url=jdbc:h2:mem:airfrance;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
app.security.admin.username=${ADMIN_USERNAME:}
app.security.admin.password=${ADMIN_PASSWORD:}
app.security.jwt-secret=${JWT_SECRET:}
app.security.jwt-issuer=airfrance-api
app.security.jwt-ttl-seconds=900
